name: Release

# Versioning only. This workflow never builds anything.
#
# Jenkins (see the Jenkinsfile) owns all compiling, artifact archiving and
# publishing to repo.luminescent.dev. release-please's job is to read
# Conventional Commits, keep a release PR open with the next version and a
# generated changelog, and cut the tag when that PR is merged.
#
# Jenkins then builds that tag and deploys it as a release.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
