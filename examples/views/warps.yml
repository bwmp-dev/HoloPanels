# A warp directory: a scrolling list on the left, detail for the highlighted
# row on the right, and a travel button underneath.
#
# Shows: pagination, per-viewer selection, a detail panel bound to another
# panel's selection, entry attributes driving visibility, and the four click
# types doing different things on the same row.
#
# Selection is per player. Two people at this board highlight different warps.

id: holopanels:warps

panels:

  title:
    type: text
    offset: { right: -2.4, up: 1.3, forward: 0.0 }
    style:
      background-opacity: 0.0
    lines:
      - '<gradient:#5ee7ff:#7a5cff><bold>WARPS</bold></gradient>'

  list:
    type: list
    offset: { right: -2.4, up: 0.0, forward: 0.0 }
    style:
      line-width: 180
    page-size: 5
    header:
      - '<gray>Left click to preview <dark_gray>· <gray>shift click to travel'
      - ''
    row: '<dark_gray>  </dark_gray><gray><entry:label>'
    selected-row: '<white>▸ </white><white><entry:label>'
    empty: '<gray>No warps are configured.'
    entries:
      spawn:
        label: 'Spawn'
        fields:
          biome: 'Plains'
          blurb: 'Where everyone starts. Shops, portals and the notice board.'
        attributes:
          donor: 'false'
      market:
        label: 'Market'
        fields:
          biome: 'Village'
          blurb: 'Player stalls. Rent a plot from the market keeper.'
        attributes:
          donor: 'false'
      mines:
        label: 'Mines'
        fields:
          biome: 'Cave'
          blurb: 'Resets weekly. Bring a pickaxe you do not mind losing.'
        attributes:
          donor: 'false'
      nether_hub:
        label: 'Nether Hub'
        fields:
          biome: 'Nether Wastes'
          blurb: 'Every linked portal on the server hangs off this room.'
        attributes:
          donor: 'false'
      end_gate:
        label: 'End Gate'
        fields:
          biome: 'The End'
          blurb: 'Staging area for dragon fights. Do not build here.'
        attributes:
          donor: 'false'
      skyfort:
        label: 'Skyfort <dark_gray>(donor)'
        fields:
          biome: 'Sky Islands'
          blurb: 'A floating build project, open to supporters.'
        attributes:
          donor: 'true'
      archive:
        label: 'The Archive <dark_gray>(donor)'
        fields:
          biome: 'Deep Dark'
          blurb: 'Museum of the map as it was two resets ago.'
        attributes:
          donor: 'true'
    clicks:
      # Both plain clicks preview. `select` with no `panel` selects within the
      # panel that was clicked.
      left:
        - type: select
      right:
        - type: select
      # Shift skips the preview and goes straight there.
      shift-left:
        - type: select
        - type: command
          command: 'warp <entry_id>'
          cooldown-ticks: 60
          cooldown-message: '<red>Wait a moment before warping again.'
      shift-right:
        - type: clear-selection

  pager:
    type: buttons
    offset: { right: -2.4, up: -1.0, forward: 0.0 }
    style:
      background-opacity: 0.0
    buttons:
      - id: previous
        text: '<dark_gray>[ <white>◀ Previous</white> <dark_gray>]'
        clicks:
          left:
            # `panel` names which panel to page. Without it, the pager would
            # try to page itself.
            - type: previous-page
              panel: list
      - id: next
        text: '<dark_gray>[ <white>Next ▶</white> <dark_gray>]'
        clicks:
          left:
            - type: next-page
              panel: list

  detail:
    type: text
    offset: { right: 2.4, up: 0.0, forward: 0.0 }
    # Bind this panel to the list's selection so <entry:...> resolves here.
    selection: list
    visible-if:
      selected: list
    style:
      line-width: 200
    lines:
      - '<white><bold><entry:label>'
      - '<dark_gray><entry:biome>'
      - ''
      - '<gray><entry:blurb>'

  hint:
    type: text
    offset: { right: 2.4, up: 0.0, forward: 0.0 }
    # The mirror image of the panel above: shown only when nothing is picked.
    visible-if:
      not:
        selected: list
    style:
      line-width: 200
      background-opacity: 0.35
    lines:
      - '<gray><italic>Choose a warp to see where it goes.'

  travel:
    type: buttons
    offset: { right: 2.4, up: -0.9, forward: 0.0 }
    selection: list
    visible-if:
      selected: list
    style:
      background-opacity: 0.0
    buttons:
      - id: go
        text: '<dark_gray>[ <green>Travel to <entry:label></green> <dark_gray>]'
        clicks:
          left:
            - type: command
              command: 'warp <entry_id>'
              cooldown-ticks: 60
              cooldown-message: '<red>Wait a moment before warping again.'
            - type: message
              message: '<gray>Off you go.'

      # Rendered only when the highlighted warp carries donor: true.
      - id: donor_note
        text: '<gold>✦ <gray>Supporter warp — <white>/donate<gray> for access.'
        visible-if:
          entry-attribute:
            name: donor
            equals: 'true'
        clicks: {}

  back:
    type: buttons
    offset: { right: 0.0, up: -1.6, forward: 0.0 }
    style:
      background-opacity: 0.0
      alignment: center
    buttons:
      - id: back
        text: '<dark_gray>[ <gray>Back</gray> <dark_gray>]'
        clicks:
          left:
            # Returns the board to its root-view and clears this player's
            # selection, paging and state.
            - type: reset
